<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PG Creative Requests</title>
<script src="config.js"></script>
<script src="gas-shim.js"></script>
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --ink:#1b1f2a; --muted:#6b7280; --line:#e5e7ee;
    --brand:#12a150; --brand-d:#0b7a3b; --ok:#12a150; --warn:#d97706; --bad:#d92d20;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  a.sheetlink{font-size:13px;color:var(--brand);text-decoration:none;font-weight:600}
  .tabs{display:flex;gap:6px;margin:14px 0}
  .tab{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
  .tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .full{grid-column:1/-1}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
  label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
  label .req{color:var(--bad)}
  label .hint{font-weight:400;color:var(--muted)}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #b7e6c9;border-color:var(--brand)}
  textarea{min-height:80px;resize:vertical}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:#fff;font-size:13px;user-select:none}
  .chip.on{background:#e8f7ee;border-color:var(--brand);color:var(--brand-d);font-weight:600}
  button.primary{background:var(--brand);color:#fff;border:0;padding:12px 22px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
  button.primary:hover{background:var(--brand-d)}
  button.primary:disabled{opacity:.6;cursor:wait}
  button.ghost{background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
  .actions{display:flex;gap:10px;align-items:center;margin-top:6px}
  .banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
  .banner.warn{background:#fff6e5;border:1px solid #f5d28b;color:#8a5200}
  .banner.err{background:#fdecea;border:1px solid #f3b4ad;color:#8a1c12}
  .banner.info{background:#e8f7ee;border:1px solid #a9e0bf;color:#0b6b36}
  .banner.ok{background:#e8f7ee;border:1px solid #a9e0bf;color:#0b6b36}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px;cursor:pointer}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12px;color:var(--muted)}
  .stat.sel{border-color:var(--brand);background:#e8f7ee}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .bar input{max-width:280px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  td select{padding:6px 8px;font-size:13px}
  .scroll{overflow-x:auto}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;background:#eef0f6;font-size:12px}
  .muted{color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1f2a;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Creative Requests</h1>
      <div class="sub">Fill the form, the row is added to the PG Creative Playbook sheet instantly.</div>
    </div>
    <a id="sheetLink" class="sheetlink" href="#" target="_blank">Open Google Sheet</a>
  </header>

  <div id="warnBox"></div>

  <div class="tabs">
    <div class="tab active" id="tabNew" onclick="showTab('new')">New Request</div>
    <div class="tab" id="tabList" onclick="showTab('list')">Tracker</div>
  </div>

  <!-- NEW REQUEST -->
  <div id="viewNew" class="card">
    <div id="msgBox"></div>
    <form id="f" onsubmit="return submitForm(event)">
      <div class="grid">
        <div>
          <label>Date <span class="req">*</span> <span class="hint">(column F)</span></label>
          <input type="date" id="date" required>
        </div>
        <div>
          <label>Month <span class="hint">(auto from date, column E)</span></label>
          <input type="text" id="month" placeholder="Nov - 26">
        </div>

        <div>
          <label>Format <span class="req">*</span></label>
          <select id="format" required></select>
        </div>
        <div>
          <label>Concept <span class="req">*</span></label>
          <select id="concept" required></select>
        </div>

        <div class="full">
          <label>Product / Collection Link <span class="req">*</span></label>
          <input type="url" id="link" placeholder="https://..." required>
        </div>
        <div class="full">
          <label>Reference <span class="req">*</span> <span class="hint">(mandatory, paste inspiration link)</span></label>
          <input type="url" id="reference" placeholder="https://..." required>
        </div>

        <div>
          <label>Quantity <span class="req">*</span></label>
          <input type="number" id="qty" min="1" step="1" value="1" required>
        </div>
        <div>
          <label>Status <span class="req">*</span></label>
          <select id="status" required></select>
        </div>

        <div class="full">
          <label>Sizes <span class="hint">(tap to select, you can pick many)</span></label>
          <div class="chips" id="sizeChips"></div>
          <input type="text" id="sizesExtra" placeholder="Other size (optional)" style="margin-top:8px;max-width:260px">
        </div>

        <div>
          <label>Variations</label>
          <select id="variations"></select>
        </div>
        <div class="full">
          <label>Additional Comments</label>
          <textarea id="comments" placeholder="Eg: Add 5 star rating, create similar for another product"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="submitBtn" type="submit">Add to Sheet</button>
        <button class="ghost" type="button" onclick="resetForm()">Clear</button>
      </div>
    </form>
  </div>

  <!-- TRACKER -->
  <div id="viewList" class="hide">
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="bar">
        <input type="text" id="search" placeholder="Search test no, concept, link..." oninput="renderRows()">
        <button class="ghost" onclick="loadTracker(true)">Refresh</button>
        <span class="muted" id="updated" style="align-self:center;font-size:12px"></span>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Row</th><th>Test</th><th>Date</th><th>Format</th><th>Concept</th><th>Product</th><th>Qty</th><th>Variations</th><th>Status</th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="9" class="muted">Loading...</td></tr></tbody>
        </table>
      </div>
      <div class="muted" style="font-size:12px;margin-top:10px">Showing latest 60 requests. Change a status here and it updates in the sheet.</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  var CFG = null, TRK = null, FILTER = '', MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); }, 2600); }
  function banner(boxId, type, text){ $(boxId).innerHTML = text ? '<div class="banner ' + type + '">' + esc(text) + '</div>' : ''; }

  function hasGas(){ return typeof google !== 'undefined' && google.script && google.script.run; }
  var GAS_MSG = 'This page only works from the Apps Script web app link (Deploy > Manage deployments > copy the Web app URL ending in /exec). It does not work when the HTML file is opened directly or in a preview.';

  function init(){
    setToday();
    $('date').addEventListener('change', updateMonth);
    if (!hasGas()){ banner('warnBox', 'info', GAS_MSG); return; }
    google.script.run
      .withSuccessHandler(function(cfg){
        CFG = cfg;
        $('sheetLink').href = cfg.sheetUrl;
        if (cfg.warnings && cfg.warnings.length) banner('warnBox', 'warn', cfg.warnings.join(' | '));
        fill('format', cfg.options.format, true);
        fill('concept', cfg.options.concept, true);
        fill('status', cfg.options.status, true, cfg.defaultStatus);
        fill('variations', cfg.options.variations, false);
        buildChips(cfg.options.sizes);
        updateMonth();
      })
      .withFailureHandler(function(e){ banner('warnBox', 'err', 'Could not load sheet: ' + (e && e.message ? e.message : e)); })
      .getConfig();
  }

  function fill(id, list, required, def){
    var el = $(id), h = '';
    if (!required || !def) h += '<option value="">' + (required ? 'Select...' : 'None') + '</option>';
    list.forEach(function(o){ h += '<option value="' + esc(o) + '"' + (o === def ? ' selected' : '') + '>' + esc(o) + '</option>'; });
    el.innerHTML = h;
  }

  function buildChips(list){
    $('sizeChips').innerHTML = list.map(function(s){ return '<div class="chip" data-v="' + esc(s) + '">' + esc(s) + '</div>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#sizeChips .chip'), function(c){
      c.onclick = function(){ c.classList.toggle('on'); };
    });
  }

  function setToday(){
    var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    $('date').value = d.toISOString().slice(0, 10);
  }
  function fmtDate(iso){ var p = iso.split('-'); return p[2] + '-' + p[1] + '-' + p[0].slice(2); }
  function updateMonth(){
    var v = $('date').value; if (!v) return;
    var p = v.split('-'); $('month').value = MON[parseInt(p[1], 10) - 1] + ' - ' + p[0].slice(2);
  }

  function selectedSizes(){
    var arr = Array.prototype.map.call(document.querySelectorAll('#sizeChips .chip.on'), function(c){ return c.getAttribute('data-v'); });
    var extra = $('sizesExtra').value.trim(); if (extra) arr.push(extra);
    return arr.join(', ');
  }

  function resetForm(){
    $('f').reset(); setToday(); updateMonth();
    if (CFG) $('status').value = CFG.defaultStatus || '';
    Array.prototype.forEach.call(document.querySelectorAll('#sizeChips .chip.on'), function(c){ c.classList.remove('on'); });
    $('qty').value = 1;
  }

  function submitForm(ev){
    ev.preventDefault();
    if (!hasGas()){ banner('msgBox', 'info', GAS_MSG); return false; }
    var payload = {
      date: fmtDate($('date').value),
      month: $('month').value.trim(),
      format: $('format').value,
      concept: $('concept').value,
      link: $('link').value.trim(),
      reference: $('reference').value.trim(),
      qty: $('qty').value,
      sizes: selectedSizes(),
      status: $('status').value,
      variations: $('variations').value,
      comments: $('comments').value.trim()
    };
    var btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'Adding...';
    banner('msgBox', '', '');
    google.script.run
      .withSuccessHandler(function(res){
        btn.disabled = false; btn.textContent = 'Add to Sheet';
        if (res && res.ok){
          banner('msgBox', 'ok', 'Added to the sheet in row ' + res.row + (res.testNo ? ' (Test No: ' + res.testNo + ')' : '') + '.');
          toast('Request added');
          var keepDate = $('date').value;
          resetForm(); $('date').value = keepDate; updateMonth();
          loadTracker(false);
        } else {
          banner('msgBox', 'err', (res && res.error) || 'Something went wrong');
        }
      })
      .withFailureHandler(function(e){
        btn.disabled = false; btn.textContent = 'Add to Sheet';
        banner('msgBox', 'err', e && e.message ? e.message : String(e));
      })
      .submitRequest(payload);
    return false;
  }

  function showTab(t){
    $('viewNew').classList.toggle('hide', t !== 'new');
    $('viewList').classList.toggle('hide', t !== 'list');
    $('tabNew').classList.toggle('active', t === 'new');
    $('tabList').classList.toggle('active', t === 'list');
    if (t === 'list') loadTracker(false);
  }

  function loadTracker(manual){
    if (!hasGas()){ $('rows').innerHTML = '<tr><td colspan="9" class="muted">' + esc(GAS_MSG) + '</td></tr>'; return; }
    google.script.run
      .withSuccessHandler(function(t){
        TRK = t; renderStats(); renderRows();
        var n = new Date(); $('updated').textContent = 'Updated ' + n.toLocaleTimeString();
        if (manual) toast('Refreshed');
      })
      .withFailureHandler(function(e){ $('rows').innerHTML = '<tr><td colspan="9" class="muted">' + esc(e && e.message ? e.message : e) + '</td></tr>'; })
      .getTracker();
  }

  function renderStats(){
    if (!TRK) return;
    var h = '<div class="stat' + (FILTER === '' ? ' sel' : '') + '" onclick="setFilter(\'\')"><b>' + TRK.total + '</b><span>All requests</span></div>';
    Object.keys(TRK.counts).sort().forEach(function(k){
      h += '<div class="stat' + (FILTER === k ? ' sel' : '') + '" data-k="' + esc(k) + '"><b>' + TRK.counts[k] + '</b><span>' + esc(k) + '</span></div>';
    });
    $('stats').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('#stats .stat[data-k]'), function(el){
      el.onclick = function(){ setFilter(el.getAttribute('data-k')); };
    });
  }
  function setFilter(k){ FILTER = (FILTER === k ? '' : k); renderStats(); renderRows(); }

  function renderRows(){
    if (!TRK) return;
    var q = $('search').value.trim().toLowerCase();
    var rows = TRK.rows.filter(function(r){
      var st = String(r.status).trim() || '(blank)';
      if (FILTER && st !== FILTER) return false;
      if (!q) return true;
      return [r.testNo, r.concept, r.link, r.format, r.comments].join(' ').toLowerCase().indexOf(q) > -1;
    });
    if (!rows.length){ $('rows').innerHTML = '<tr><td colspan="9" class="muted">No requests found.</td></tr>'; return; }
    var statusList = (CFG && CFG.options.status) || [];
    $('rows').innerHTML = rows.map(function(r){
      var opts = statusList.slice();
      if (r.status && opts.indexOf(r.status) === -1) opts.unshift(r.status);
      var sel = '<select onchange="changeStatus(' + r.row + ', this)">' +
        '<option value="">(blank)</option>' +
        opts.map(function(o){ return '<option value="' + esc(o) + '"' + (o === r.status ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
        '</select>';
      var link = r.link ? '<a href="' + esc(r.link) + '" target="_blank">Open</a>' : '';
      return '<tr><td class="muted">' + r.row + '</td><td>' + esc(r.testNo) + '</td><td>' + esc(r.date) + '</td><td><span class="pill">' + esc(r.format) + '</span></td><td>' + esc(r.concept) +
        (r.comments ? '<div class="muted" style="font-size:12px">' + esc(r.comments) + '</div>' : '') + '</td><td>' + link + '</td><td>' + esc(r.qty) + '</td><td>' + esc(r.variations) + '</td><td>' + sel + '</td></tr>';
    }).join('');
  }

  function changeStatus(row, el){
    if (!hasGas()){ toast('Open the web app link to update status'); return; }
    google.script.run
      .withSuccessHandler(function(res){
        if (res && res.ok){ toast('Status updated in row ' + row); loadTracker(false); }
        else { toast(res && res.error ? res.error : 'Update failed'); loadTracker(false); }
      })
      .withFailureHandler(function(e){ toast(e && e.message ? e.message : 'Update failed'); loadTracker(false); })
      .updateStatus(row, el.value);
  }

  setInterval(function(){ if (!$('viewList').classList.contains('hide')) loadTracker(false); }, 60000);
  init();
</script>
</body>
</html>
